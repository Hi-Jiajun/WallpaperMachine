<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' mwe-ui: https: data:; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <title>WallpaperMachine</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./panel.css">
  <link rel="stylesheet" href="./settings.css">
  <link rel="stylesheet" href="./welcome.css">
  <script type="module" src="./panel.js"></script>
</head>
<body>
  <div id="app">
    <nav id="sidebar" class="sidebar" aria-label="Main navigation" data-i18n-label="Main navigation">
      <div class="sidebar-titlebar"></div>
      <div id="sidebar-library" class="sidebar-pane sidebar-library"></div>
      <div id="sidebar-settings" class="sidebar-pane sidebar-settings" hidden>
        <div id="sidebar-settings-back" class="sidebar-back"></div>
        <div id="sidebar-settings-nav" class="sidebar-settings-nav"></div>
      </div>
    </nav>
    <header class="topbar">
      <div id="page-title" class="page-title"></div>
      <div id="top-actions" class="top-actions"></div>
    </header>
    <div class="window-body">
      <div id="error-banner" class="error-banner" role="alert" hidden></div>
      <div id="held-banner" class="held-banner" role="status" hidden></div>
      <main id="main">
        <section id="library-page" class="library-page" aria-label="Wallpapers" data-i18n-label="Wallpapers">
          <section class="browser-column" aria-label="Wallpaper browser" data-i18n-label="Wallpaper browser">
            <div id="browser-toolbar" class="browser-toolbar"></div>
            <div id="browser-summary" class="browser-summary" aria-live="polite"></div>
            <div id="wallpaper-grid" class="wallpaper-grid" aria-label="Wallpapers" data-i18n-label="Wallpapers"></div>
            <div id="browser-empty" class="empty-state" role="status"><h1 data-i18n="Connecting to WallpaperMachine">Connecting to WallpaperMachine</h1><p data-i18n="Waiting for the native application.">Waiting for the native application.</p></div>
            <div id="pagination" class="pagination"></div>
          </section>
          <aside id="inspector" class="inspector" aria-label="Wallpaper details" data-i18n-label="Wallpaper details"></aside>
        </section>
        <section id="settings-content" aria-label="Settings" data-i18n-label="Settings" hidden></section>
      </main>
    </div>
    <aside id="filter-sidebar" class="popover filter-popover" role="dialog" aria-label="Filters" data-i18n-label="Filters" tabindex="-1" hidden></aside>
    <div id="queue-popover" class="popover queue-popover" role="dialog" aria-labelledby="queue-popover-title" tabindex="-1" hidden></div>
    <div id="import-popover" class="popover import-popover" role="dialog" aria-labelledby="import-popover-title" tabindex="-1" hidden></div>
    <div id="history-popover" class="popover history-popover" role="dialog" aria-labelledby="history-popover-title" tabindex="-1" hidden></div>
    <dialog id="download-dialog" class="download-dialog" aria-labelledby="download-dialog-title"></dialog>
    <dialog id="support-dialog" class="download-dialog" aria-labelledby="support-dialog-title" aria-describedby="support-dialog-description"></dialog>
  </div>
  <section id="welcome" class="welcome" role="region" aria-labelledby="welcome-title" hidden></section>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
